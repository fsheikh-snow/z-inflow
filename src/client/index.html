<html>
<head>
  <title>Z-Inflow PM Workspace</title>

  <!-- Strip platform UXF query params before now-ux-globals boots a second React
       tree (ProjectDetail.jsdb / React #306). Our SPA uses hash routing only. -->
  <script>
    (function () {
      try {
        var url = new URL(window.location.href);
        var view = url.searchParams.get('view');
        var id = url.searchParams.get('id');
        if (view || id === '-1') {
          url.searchParams.delete('view');
          url.searchParams.delete('id');
          window.history.replaceState({}, '', url.pathname + url.search + url.hash);
        }
      } catch (e) { /* ignore */ }
    })();
  </script>

  <!-- CSRF / session globals only — do not mount UXF pages into this BYOUI shell -->
  <sdk:now-ux-globals></sdk:now-ux-globals>

  <script src="./main.jsx" type="module"></script>
</head>
<body>
  <!-- Loading text must stay OUTSIDE #root: ServiceNow platform scripts can
       move/mutate nodes under #root, which breaks React's removeChild on mount. -->
  <div id="pm-workspace-loading" style="font-family:sans-serif;padding:48px;color:#64748b;text-align:center">
    ZFlow / PM Workspace loading...
  </div>
  <div id="root" data-pm-workspace-root="1"></div>
</body>
</html>
